name: LearningSteps checks

on:
  push:
  pull_request:
  workflow_dispatch:

# Checks never receive Azure/OIDC credentials, including on pull requests.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  quality:
    name: Python lint and user-isolation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: learningsteps_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d learningsteps_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci-only@127.0.0.1:5432/learningsteps_ci
      PYTHONPATH: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.lock
      - name: Install locked app dependencies and lint tool
        run: |
          python -m pip install --only-binary=:all: -r api/requirements.lock
          python -m pip install ruff==0.14.14
          python -m pip check
      - name: Lint syntax, invalid constructs and undefined names
        run: ruff check --select E9,F63,F7,F82 api tests scripts
      - name: Unit and real database isolation tests
        run: python scripts/ci_tests.py

  source-security:
    name: Secret and Terraform security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Secret scan (working tree)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs \
            --scanners secret --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs /src/.git /src
      - name: Terraform static security analysis
        if: ${{ !cancelled() }}
        run: |
          printf '%s\n' \
            'aks_admin_object_id = "00000000-0000-0000-0000-000000000001"' \
            'aks_api_allowed_cidr = "203.0.113.10/32"' \
            > "$RUNNER_TEMP/security-scan.tfvars"
          docker run --rm -v "$PWD/infra-terraform:/src:ro" \
            -v "$RUNNER_TEMP/security-scan.tfvars:/scan.tfvars:ro" \
            "$TRIVY_IMAGE" config --tf-vars /scan.tfvars \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 10m /src

  image-security:
    name: Production image build, startup and vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build --platform linux/amd64 --tag learningsteps-api:ci .
      - name: Hardened startup and authentication smoke test
        run: |
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges=true learningsteps-api:ci \
            python - < tests/check_container_smoke.py
      - name: Scan exact built image
        run: |
          docker image save --output "$RUNNER_TEMP/api-image.tar" learningsteps-api:ci
          docker run --rm -v "$RUNNER_TEMP/api-image.tar:/scan/image.tar:ro" \
            "$TRIVY_IMAGE" image --input /scan/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 10m
