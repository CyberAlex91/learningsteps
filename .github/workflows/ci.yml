# Zweck: Prüft Quellen, Tests, Historie und Image und liefert nur geprüfte Images über OIDC aus.
name: LearningSteps CI and delivery

on:
  push:
  pull_request:
  workflow_dispatch:

# Checks never receive Azure/OIDC credentials, including on pull requests.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  quality:
    name: Python lint and user-isolation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: learningsteps_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d learningsteps_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci-only@127.0.0.1:5432/learningsteps_ci
      PYTHONPATH: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.lock
      - name: Install locked app dependencies and lint tool
        run: |
          python -m pip install --only-binary=:all: -r api/requirements.lock
          python -m pip install ruff==0.14.14 PyYAML==6.0.3
          python -m pip check
      - name: Lint syntax, invalid constructs and undefined names
        run: ruff check --select E9,F63,F7,F82 api tests scripts
      - name: Unit and real database isolation tests
        run: python scripts/ci_tests.py

  source-security:
    name: Secret and Terraform security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Secret scan (complete fetched Git history)
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges=true \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo -v "$PWD/.git:/repo:ro" \
            -v "$PWD/security/gitleaks-reviewed-fingerprints.txt:/reviewed-fingerprints:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --redact=100 --no-banner --log-level error \
            --ignore-gitleaks-allow --gitleaks-ignore-path /reviewed-fingerprints \
            --timeout 300 --exit-code 1
      - name: Secret scan (working tree)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs \
            --scanners secret --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs /src/.git /src
      - name: Terraform static security analysis
        if: ${{ !cancelled() }}
        run: |
          printf '%s\n' \
            'aks_admin_object_id = "00000000-0000-0000-0000-000000000001"' \
            'aks_api_allowed_cidr = "203.0.113.10/32"' \
            > "$RUNNER_TEMP/security-scan.tfvars"
          docker run --rm -v "$PWD/infra-terraform:/src:ro" \
            -v "$RUNNER_TEMP/security-scan.tfvars:/scan.tfvars:ro" \
            "$TRIVY_IMAGE" config --tf-vars /scan.tfvars \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 10m /src

  image-security:
    name: Production image build, startup and vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build --platform linux/amd64 --tag learningsteps-api:ci .
      - name: Hardened startup and authentication smoke test
        run: |
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges=true learningsteps-api:ci \
            python - < tests/check_container_smoke.py
      - name: Scan exact built image
        run: |
          docker image save --output "$RUNNER_TEMP/api-image.tar" learningsteps-api:ci
          docker run --rm -v "$RUNNER_TEMP/api-image.tar:/scan/image.tar:ro" \
            "$TRIVY_IMAGE" image --input /scan/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 10m
      - name: Record scanned image identity and archive checksum
        run: |
          docker image inspect learningsteps-api:ci --format '{{.Id}}' > "$RUNNER_TEMP/scanned-image-id.txt"
          cd "$RUNNER_TEMP"
          sha256sum api-image.tar > api-image.tar.sha256
      - name: Retain exact scanned image for trusted delivery
        if: github.event_name == 'push' && github.repository == 'CyberAlex91/learningsteps' && github.ref == 'refs/heads/main' && vars.LEARNINGSTEPS_CLOUD_ENABLED != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scanned-api-image
          path: |
            ${{ runner.temp }}/api-image.tar
            ${{ runner.temp }}/api-image.tar.sha256
            ${{ runner.temp }}/scanned-image-id.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  delivery:
    name: OIDC image push and AKS rollout
    needs: [quality, source-security, image-security]
    if: github.event_name == 'push' && github.repository == 'CyberAlex91/learningsteps' && github.ref == 'refs/heads/main' && vars.LEARNINGSTEPS_CLOUD_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download scanned image from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: scanned-api-image
          path: ${{ runner.temp }}/delivery
          digest-mismatch: error
      - name: Verify archive and image before Azure login
        working-directory: ${{ runner.temp }}/delivery
        run: |
          sha256sum --check api-image.tar.sha256
          docker image load --input api-image.tar
          actual=$(docker image inspect learningsteps-api:ci --format '{{.Id}}')
          expected=$(cat scanned-image-id.txt)
          test "$actual" = "$expected"
      - name: Azure login using short-lived GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push unchanged image and verify registry digest
        id: push
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          registry=acrlearningstepsalex0ad5f630
          repo="$registry.azurecr.io/learningsteps-api"
          image="$repo:git-$REVISION"
          az acr login --name "$registry" --expose-token --query accessToken -o tsv |
            docker login "$registry.azurecr.io" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          docker tag learningsteps-api:ci "$image"
          docker push "$image"
          local_ref=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          test "${local_ref%@*}" = "$repo"
          remote_digest=$(az acr repository show --name "$registry" --image "learningsteps-api:git-$REVISION" --query digest -o tsv)
          test "${local_ref##*@}" = "$remote_digest"
          echo "image=$repo@$remote_digest" >> "$GITHUB_OUTPUT"
      - name: Deploy verified digest through Azure AKS Run Command
        env:
          IMAGE_REF: ${{ steps.push.outputs.image }}
        run: python3 scripts/ci_deploy.py
      - name: Verify public HTTPS after rollout
        run: python3 scripts/check_https_access.py --timeout 60
      - name: Preserve rollout evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deployment-evidence
          path: ${{ runner.temp }}/deployment-evidence.json
          if-no-files-found: error
          retention-days: 14
