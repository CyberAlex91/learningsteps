# Zweck: Definiert einen kurzlebigen Diagnose-Pod für kontrollierte Datenbank-Anmeldetests.
apiVersion: v1
kind: Pod
metadata:
  name: learningsteps-db-login-check
  namespace: learningsteps
  labels:
    app.kubernetes.io/part-of: learningsteps
    app.kubernetes.io/component: diagnostic
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 600
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: acrlearningstepsalex0ad5f630.azurecr.io/learningsteps-api@sha256:58023fe9aaa027e22ec008a7b137cc3a93d1727965e801a44cb642f5b5628171
      imagePullPolicy: IfNotPresent
      command: ["python", "-c", "import time; time.sleep(590)"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
